---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

platforms:
  - name: "systemd-service-${MOLECULE_SCENARIO_NAME}"
    image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
    command: ${DOCKER_COMMAND:-""}
    pre_build_image: true
    privileged: true
    groups:
      - network_hosts

provisioner:
  name: ansible
  lint:
    name: ansible-lint
  playbooks:
    prepare: ../../tests/prepare.yml
    converge: ../../tests/test.yml
    verify: ../../tests/verify.yml
    side_effect: ../../tests/side_effect.yml
  config_options:
    defaults:
      inject_facts_as_vars: false

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - destroy
